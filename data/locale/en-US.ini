Designer.Bridge="Bridge Text"
Designer.BridgeSvg="Bridge Artwork"
Designer.BridgeSvgFilter="SVG artwork"
Designer.ChooseBridgeSvg="Choose the artwork the bridge is drawn from"
Designer.BridgeThickness="Bridge Thickness"
Designer.BridgeThickness.Tip="How tall the artwork is drawn. Its width follows from its own proportions."
Designer.BridgeOffset="Bridge Height"
Designer.BridgeOffset.Tip="How far above the text's baseline the artwork sits. At 0 it rests on the baseline, like a run of leader dots."
Designer.BridgeGap="Bridge End Gap"
Designer.BridgeGap.Tip="Space left clear at each end of the artwork, so it does not run into the words it joins."
Designer.BridgeMinGap="Gap Width"
Designer.BridgeMinGap.Tip="The least space kept between the two texts when the bridge draws nothing. Anything the columns leave over past it belongs to the gap as well."
Designer.BridgeTint="Draw the artwork in the text's own color"
Designer.BridgeFill="Bridge Fill"
Designer.BridgeFill.Tip="What the artwork does with the space between the two texts. Draw Once lays in a single copy at its own width, Repeat tiles as many whole copies as fit, and Stretch Across Gap scales one copy to span whatever is left."
Designer.BridgeFill.Fixed="Draw Once"
Designer.BridgeFill.Repeat="Repeat"
Designer.BridgeFill.Stretch="Stretch Across Gap"
Designer.BridgeSizing="Column Widths"
Designer.BridgeSizing.Tip="Fixed Column gives each side the same share of the width on every row, so the bridge starts at the same place all the way down. Dynamic Column gives each side only as much room as its own text asks for, so the bridge starts wherever that row's text ends."
Designer.BridgeSizing.Split="Fixed Column"
Designer.BridgeSizing.Natural="Dynamic Column"
Designer.BridgeSplit="Bridge Starts At"
Designer.BridgeSplit.Tip="How much of the width goes to the left-hand text before the bridge begins."
Designer.BridgeRowAlign="Row Placement"
Designer.BridgeSpanEmpty="Run the bridge to the edge when one side is empty"
Designer.RowSubtitles="Give each side a subtitle"
Designer.RowSubtitles.Tip="Adds a second line under each side of every row, from the Left Subtitle and Right Subtitle columns. A row that leaves one empty draws nothing there and takes up no more room for it."
Designer.Columns="Columns"
Designer.ColumnGap="Column Gap"
Designer.FillOrder="Fill Order"
Designer.FillOrder.Tip="Which way the entries run through a list of several columns. Down First fills a column to the bottom before starting the next one, the way a cast list reads. Across First fills a row at a time."
Designer.FillDown="Down First"
Designer.FillAcross="Across First"
Designer.EntryGap="Entry Gap"
Designer.IndentStep="Indent Step"
Designer.IndentStep.Tip="How far one step of an entry's Indent moves it. Set once for the list, so tabbed entries line up with each other."
Designer.SubtitleGap="Title-Subtitle Gap"
Designer.SubtitleGap.Tip="The space between a title and the subtitle under it. In a list, keep it smaller than the entry gap so each pair reads as one item."
Designer.SubtitleOrder="Stacking Order"
Designer.SubtitleOrder.Tip="Which of the two lines is drawn on top. The fields you type into keep their meaning either way."
Designer.SubtitleOrder.TitleFirst="Title above subtitle"
Designer.SubtitleOrder.SubtitleFirst="Subtitle above title"
Designer.DividerMirrorEnds="Draw both ends the same way"
Designer.DividerMirrorEnds.Tip="The right-hand end is the left one flipped over, which is what keeps the two ends of a rule from drifting apart as you work on it. Turn it off to set them separately - for an arrow that flies one way."
Designer.DividerArm="Rule"
Designer.DividerArmSvg="Rule Artwork"
Designer.DividerThickness="Thickness"
Designer.DividerThickness.Tip="How tall the rule itself is drawn. Everything else is a proportion of it, so this one number resizes the whole divider and an arrowhead stays an arrowhead."
Designer.DividerConnect="Join the parts into one piece"
Designer.DividerConnect.Tip="Runs the rule the whole way through instead of stopping at what it meets, so the ends and the middle sit on one unbroken line rather than beside several short ones. The parts are inked together, so nothing shows where they meet."
Designer.DividerGap="End Gap"
Designer.DividerGap.Tip="Space left clear where the rule meets something - the shape capping it and whatever sits in the middle. Below zero it stops holding them apart and pushes them into each other instead, which is another way to make the parts read as one."
Designer.DividerPieceGap="Gap Between Middle Pieces"
Designer.DividerPieceGap.Tip="Space between consecutive pieces of a stack. Below zero they overlap, up to halfway into each other."
Designer.DividerRules="Parallel Rules"
Designer.DividerRules.Tip="How many rules run side by side. Whatever is in the middle is drawn once across the whole stack, not once per rule."
Designer.DividerRuleGap="Gap Between Rules"
Designer.DividerRuleInset="Rule Taper"
Designer.DividerRuleInset.Tip="How much shorter each rule is than the one next to it, so a stack of them tapers to a wedge. At 0 they are all the same length."
Designer.DividerTint="Draw your artwork in the section's own color"
Designer.ChooseDividerSvg="Choose the artwork this part is drawn from"
