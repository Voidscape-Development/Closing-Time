Designer.Seconds=" s"
Designer.StickyAnchor="Pin This Part Of The Block"
Designer.StickyAnchor.Top="Top Edge"
Designer.StickyAnchor.Center="Center Screen"
Designer.StickyAnchor.Bottom="Bottom Edge"
Designer.StickyAnchor.Tip="Which part of the block lands on the position below. Its middle at 50% is a block centered in the frame; its top edge at 0% is a block that stops with its first line at the top of the frame."
Designer.StickyCanvasPosition="Down The Frame"
Designer.StickyCanvasPosition.Tip="How far down the frame the pinned part lands - 0% is the top edge, 100% the bottom. A share of the height rather than a pixel count, so the roll still pins where it was meant to if the canvas is resized."
Designer.StickyOffset="Nudge"
Designer.StickyOffset.Tip="Moves the pinned block up or down by a few pixels, for when the share above is nearly right."
Designer.StickyHold="Hold For"
Designer.StickyHold.Tip="How long the block stays pinned before its release takes over. The rest of the roll goes on scrolling behind it the whole time."
Designer.StickyHoldForever="Hold until something else stops the roll"
Designer.StickyHoldForever.Tip="Keeps the block pinned indefinitely - for a card that stays up until a hotkey, a scene change or the stream ending takes it away."
Designer.StickyHoldForever.Warning="This block holds for ever and is set to end the roll when its hold runs out, so the roll never ends on its own and the ending action never fires."
Designer.StickyRelease="When The Hold Ends"
Designer.StickyRelease.EndAtHold="Hold and Fire Ending Action"
Designer.StickyRelease.ResumeThenEnd="Fire Ending Action After Leaving Screen"
Designer.StickyRelease.ResumeEndAtHold="Fire Ending Action While Leaving Screen"
Designer.StickyRelease.Tip="What the block does when its hold runs out, and what counts as the end of the roll. Whichever is chosen, the rest of the roll keeps scrolling behind the block while it is pinned."
Designer.PaddingTop="Padding Above"
Designer.PaddingBottom="Padding Below"
Designer.MarginX="Side Margins"
Designer.ContentOffsetX="Text Offset"
Designer.ContentOffsetX.Tip="Slides everything this section draws sideways - below zero to the left, above it to the right - keeping the arrangement inside it. Side margins inset both edges equally and can only ever center what is between them; this is what puts a section deliberately off its own center."
Designer.SectionWidth="Section Width"
Designer.SectionWidth.Tip="How much of the canvas width this section is laid out across. The side margins are then taken off that."
Designer.SectionAlign="Section Placement"
Designer.SectionAlign.Tip="Where the section sits on the canvas once it is narrower than the full width. The side margins hold it clear of whichever edge it is placed against. A logo row set to move with its text is placed by this at any width, since the pair is narrower than the section whatever it is given."

Designer.Background.Slot.section="Panel Behind The Section"
Designer.Background.Slot.section.Tip="A panel drawn behind everything this section draws, over its whole height including its padding. It never moves anything: switching one on cannot change where a section sits or how long the roll runs."
Designer.Background.Slot.title="Panel Behind The Title"
Designer.Background.Slot.title.Tip="A panel behind the main line of text - the heading, or the left-hand column of a bridged row."
Designer.Background.Slot.subtitle="Panel Behind The Subtitle"
Designer.Background.Slot.subtitle.Tip="A panel behind the second text - the line under a heading, or the right-hand column of a bridged row."
Designer.Background.Slot.logo="Panel Behind Each Logo"
Designer.Background.Slot.logo.Tip="A card behind every logo this section places, hugging the artwork. Use the outset to take it wider than the picture."
Designer.Background.Slot.entry="Panel Behind Each Entry"
Designer.Background.Slot.entry.Tip="A panel behind every row of the list, or every cell of a grid, across the width the list occupies."
Designer.Background.Slot.entry_alt="Panel Behind Every Other Entry"
Designer.Background.Slot.entry_alt.Tip="Switch this on and the list stripes: this panel is drawn behind the odd-numbered rows instead of the one above. Leave its fill on None and every other row is left bare."
Designer.Background.Slot.bridge="Panel Behind The Bridge"
Designer.Background.Slot.bridge.Tip="A panel behind the leader joining the two sides of a row. It is only as tall as the leader draws, so the outset is usually what makes it worth seeing."
Designer.Background.Slot.divider="Panel Behind The Divider"
Designer.Background.Slot.divider.Tip="A panel behind the divider's artwork, over the box that artwork actually occupies - which is narrower and shorter than the section itself."

