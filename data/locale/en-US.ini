Designer.LogoStartOnEnter.Tip="Begin when the logo scrolls into the canvas rather than when the roll starts. Worth setting for a play-once sting partway down a long roll, which would otherwise have finished before anyone could see it."
Designer.LogoSpeed="Speed"
Designer.LogoSpeed.Tip="Multiplier on the artwork's own frame timing. 1.00x is the file's native rate."
Designer.LogoAnimatedShadow="Shadow follows the animation"
Designer.LogoAnimatedShadow.Tip="Recompute the drop shadow for every frame instead of casting the first frame's. Only worth it for artwork that changes shape as it plays; it costs a blur per frame when the roll is built."
