Designer.Background.Image.Placeholder="Path to an image file"
Designer.Background.Image.Pick="Choose a background image"
Designer.Background.Fit="Fitted By"
Designer.Background.Fit.Tip="What happens when the image and the panel are not the same shape. An animated file contributes its first frame only - a panel is drawn into the roll itself and has nothing to animate in."
Designer.Background.Fit.cover="Cover - fill it, crop the overflow"
Designer.Background.Fit.contain="Contain - fit it, show the panel past it"
Designer.Background.Fit.stretch="Stretch - ignore its proportions"
Designer.Background.Fit.tile="Tile - repeat it at its own size"
Designer.Background.Opacity="Opacity"
Designer.Background.Opacity.Tip="Applied to the whole panel, fill and border together."
Designer.Background.Outset="Reaches Past By"
Designer.Background.Outset.Tip="How far the panel reaches past the thing it sits behind, on every side. The room inside the panel is the section's own padding; this is for a panel that has to reach further out than that - a band running to the edges of the frame. Negative pulls it in. It never moves anything: the panel paints outside its box the way a drop shadow does."
Designer.Background.Outset.PerSide="Reach a different distance on each side"
Designer.Background.Outset.PerSide.Tip="For a panel that runs out to one edge of the frame and stops short of the other."
Designer.Background.Outset.Sides="Left, Top, Right, Bottom"
Designer.Background.Outset.Sides.Tip="How far the panel reaches past its box on each side in turn."
Designer.Background.Radius="Corner Radius"
Designer.Background.Radius.Tip="How far the corners are rounded. A radius past half the panel's height reads as a pill; one larger than the panel can hold is scaled down to fit rather than clipped, so the same panel keeps its shape behind a shorter section."
Designer.Background.Radius.PerCorner="Round each corner differently"
Designer.Background.Radius.PerCorner.Tip="For a panel rounded at the top and square at the bottom, so it reads as sitting on what is under it - or for a tab."
Designer.Background.Radius.Corners="Top Left, Top Right, Bottom Right, Bottom Left"
Designer.Background.Radius.Corners.Tip="Each corner's radius in turn, clockwise from the top left."
Designer.Background.Border="Border"
Designer.Background.BorderWidth="Border Width"
Designer.Background.BorderColor="Border Color"

