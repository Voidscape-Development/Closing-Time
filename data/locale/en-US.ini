ManualScroll="Scroll by hand instead of playing"
ManualScroll.Tip="Parks the roll wherever the slider says instead of scrolling it, so a section in the middle of a long roll can be looked at without waiting for the roll to reach it. Nothing moves while this is on: the roll does not scroll, the ending action cannot fire, and the start and pause hotkeys have nothing to act on."
ManualScroll.Warning="The roll is parked and will not scroll on its own. Turn this off before going live."
ScrollPosition="Position In The Roll"
ScrollPosition.Tip="How far through the roll to park it, as a share of the whole travel. At 0% the roll is at its start with nothing on screen yet; at 100% it has cleared the frame. Measured as a percentage rather than in pixels or seconds so it keeps its meaning as the credits are edited."

