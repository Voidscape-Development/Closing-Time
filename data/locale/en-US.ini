Designer.Column.Indent="Indent"
Designer.Column.Indent.Tip="How many steps this entry is tabbed in from the rest of the list - a department over the names under it, a sub-heading inside a run. Negative steps out the other way. One step is the Indent Step set on the section, so a run of entries lines up without each one being measured."
Designer.DividerPieces="Divider Parts"
Designer.DividerPieces.Tip="What sits at each end of the rule and in the middle of it, in order, left to right. Every tab holds the same kind of piece - an ornament, a word or an image - so a shape offered at an end is offered in the middle too. Leave a tab empty for an end with nothing on it, or an unbroken rule."
